{% extends "base.html" %}
{% block title %}Cadastrar empresa - TrackFlow{% endblock %}
{% block content %}
<h1>Cadastrar empresa</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Criar conta</button>
</form>
<p>Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
{% endblock %}
